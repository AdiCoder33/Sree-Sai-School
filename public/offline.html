<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline</title>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        text-align: center;
        padding: 1rem;
      }
      img {
        width: 120px;
        height: auto;
        margin-bottom: 1rem;
      }
      button {
        padding: 0.5rem 1rem;
        font-size: 1rem;
        cursor: pointer;
      }
      .links {
        margin-top: 1rem;
      }
      .links a {
        margin-left: 1rem;
      }
    </style>
  </head>
  <body>
    <img src="/apple-icon-180.png" alt="Sree Sai School logo" />
    <h1>You're offline</h1>
    <p>Check your connection and try again.</p>
    <div class="links">
      <button onclick="location.reload()">Retry</button>
      <a href="/">Go Home</a>
    </div>
  </body>
</html>
